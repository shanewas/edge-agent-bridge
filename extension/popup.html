<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Antigravity Edge Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      width: 280px;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    .title {
      font-weight: 600;
      color: #fff;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.connected {
      background: #1b4d3e;
      color: #4ade80;
    }
    .badge.disconnected {
      background: #5c1d1d;
      color: #f87171;
    }
    .section {
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .info-box {
      background: #252526;
      border-radius: 6px;
      padding: 8px;
      border: 1px solid #333;
      word-break: break-all;
      font-family: monospace;
      font-size: 11px;
    }
    .log-box {
      background: #181818;
      border-radius: 6px;
      padding: 8px;
      border: 1px solid #2d2d2d;
      font-family: monospace;
      font-size: 11px;
      color: #9cdcfe;
      max-height: 80px;
      overflow-y: auto;
    }
    .footer {
      font-size: 11px;
      color: #777;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Antigravity Bridge</div>
    <div id="statusBadge" class="badge disconnected">Offline</div>
  </div>

  <div class="section">
    <div class="label">Bridge Server</div>
    <div class="info-box">http://127.0.0.1:18999</div>
  </div>

  <div class="section">
    <div class="label">Active Tab</div>
    <div id="tabInfo" class="info-box">Loading...</div>
  </div>

  <div class="section">
    <div class="label">Activity</div>
    <div id="logBox" class="log-box">Waiting for agent commands...</div>
  </div>

  <div class="footer">Antigravity Agent Driving Edge</div>

  <script src="popup.js"></script>
</body>
</html>
