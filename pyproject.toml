[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent-bridge"
version = "1.1.0"
description = "Real-time AI agent bridge for Microsoft Edge using active browser sessions, CDP hardware events, and WebSockets."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shanewas Ahmed", email = "shanewas.nabil@gmail.com" }
]
requires-python = ">=3.8"
keywords = ["edge", "browser-automation", "agent", "cdp", "websocket", "ai-agents", "real-time"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shanewas/edge-agent-bridge"
Repository = "https://github.com/shanewas/edge-agent-bridge"
Issues = "https://github.com/shanewas/edge-agent-bridge/issues"
Funding = "https://github.com/sponsors/shanewas"

[project.scripts]
edge-bridge = "edge_agent_bridge.cli:main"
edge = "edge_agent_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edge_agent_bridge*"]

[tool.setuptools.package-data]
edge_agent_bridge = [
    "extension/*.js",
    "extension/*.html",
    "extension/*.json",
    "extension/icons/*.png"
]
